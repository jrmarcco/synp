global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  # 网关管理面 ( /metrics )。
  # 目标经 file_sd 管理: 修改 targets/*.json 即热加载 ( 无需重启 )。
  # 默认指向宿主机上运行的网关节点; 容器化网关改为对应服务名 ( 如 gateway:9090 )。
  - job_name: synp-gateway
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 15s

  # Prometheus 自监控。
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
