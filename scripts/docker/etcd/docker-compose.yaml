x-etcd-common: &etcd-common
  image: quay.io/coreos/etcd:v3.6.8
  restart: unless-stopped
  networks:
    - jrmarcco_net
  healthcheck:
    # 就绪探测: 本节点 endpoint health。
    # server 证书 EKU 同时含 serverAuth/clientAuth, 可直接作客户端证书。
    # 注意: coreos/etcd 为 distroless 镜像 ( 无 shell ), 必须用 exec 数组形式。
    # --user: 启用认证 ( 见文件尾 user-add 实例 ) 后匿名访问被拒,
    # healthcheck 探测的 key ( "health" ) 不在业务角色授权前缀内, 需用 root。
    test: ["CMD", "etcdctl", "--endpoints=https://localhost:2379", "--cert=/etcd-certs/server.pem", "--key=/etcd-certs/server-key.pem", "--cacert=/etcd-certs/ca.pem", "--user=root:<passwd>", "endpoint", "health"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 20s
  environment: &etcd-common-env
    ETCD_DATA_DIR: /etcd-data
    ETCD_LISTEN_CLIENT_URLS: https://0.0.0.0:2379
    ETCD_CERT_FILE: /etcd-certs/server.pem
    ETCD_KEY_FILE: /etcd-certs/server-key.pem
    ETCD_TRUSTED_CA_FILE: /etcd-certs/ca.pem
    ETCD_CLIENT_CERT_AUTH: "true"
    ETCD_LISTEN_PEER_URLS: https://0.0.0.0:2380
    ETCD_PEER_CERT_FILE: /etcd-certs/server.pem
    ETCD_PEER_KEY_FILE: /etcd-certs/server-key.pem
    ETCD_PEER_TRUSTED_CA_FILE: /etcd-certs/ca.pem
    ETCD_PEER_CLIENT_CERT_AUTH: "true"
    ETCD_INITIAL_CLUSTER_TOKEN: synp-etcd-cluster
    ETCD_INITIAL_CLUSTER: etcd-1=https://node-1:2380,etcd-2=https://node-2:2380,etcd-3=https://node-3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_CIPHER_SUITES: TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    ETCD_TLS_MIN_VERSION: TLS1.2

networks:
  jrmarcco_net:
    external: true

services:
  node-1:
    <<: *etcd-common
    environment:
      <<: *etcd-common-env
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: https://node-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://node-1:2380
    ports:
      - "12379:2379"  # Client port ( HTTPS only )
      - "12380:2380"  # Peer port ( HTTPS only )
    volumes:
      - ./data-1:/etcd-data
      - ./certs:/etcd-certs:ro

  node-2:
    <<: *etcd-common
    environment:
      <<: *etcd-common-env
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: https://node-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://node-2:2380
    ports:
      - "22379:2379"  # Client port ( HTTPS only )
      - "22380:2380"  # Peer port ( HTTPS only )
    volumes:
      - ./data-2:/etcd-data
      - ./certs:/etcd-certs:ro

  node-3:
    <<: *etcd-common
    environment:
      <<: *etcd-common-env
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: https://node-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://node-3:2380
    ports:
      - "32379:2379"  # Client port ( HTTPS only )
      - "32380:2380"  # Peer port ( HTTPS only )
    volumes:
      - ./data-3:/etcd-data
      - ./certs:/etcd-certs:ro

# ================================ 初始化用户 ================================= #
# 实例操作: 启用认证, 创建网关与后端共用的服务注册/发现用户 synp/<passwd>。
# ( etcdctl.sh 自动拼接 TLS 参数; 启用认证后的命令需前置 ETCD_PASSWORD )
#
# 1. root 用户 ( etcd 约定: auth enable 前必须存在; root 角色为内置超级管理员 )
#    ./etcdctl.sh role-add root
#    ./etcdctl.sh user-add root                    # 交互式输入密码
#    ./etcdctl.sh user grant-role root root
#
# 2. 业务用户 synp 与角色: 网关/后端经此用户做服务注册与发现。
#    注册 key 布局为 /<key_prefix>/<service>/<addr>, 两端 key_prefix 均为 synp
#    ( gateway: etc/config.yaml 的 synp.grpc.registry.key_prefix ),
#    故只需授权 /synp/ 前缀读写:
#    ./etcdctl.sh user-add synp                    # 交互式输入密码
#    ./etcdctl.sh role-add synp-rw
#    ./etcdctl.sh role grant-permission --prefix=true synp-rw readwrite /synp/
#    ./etcdctl.sh user grant-role synp synp-rw
#
# 3. 启用认证 ( 之后所有客户端必须携带凭据, 匿名访问被拒;
#    本文件 healthcheck 已带 root 凭据, 无需额外处理 )
#    ./etcdctl.sh auth-enable
#
# 4. 验证 ( 业务用户视角可读写, 匿名被拒 )
#    ETCD_USER=synp ETCD_PASSWORD='<passwd>' ./etcdctl.sh get --prefix /synp/
#
# 客户端接入: gateway 在 etc/config.yaml 的 etcd.username/etcd.password
# 填 synp / <passwd>; backend 同理。
# ================================ 初始化用户 ================================= #
