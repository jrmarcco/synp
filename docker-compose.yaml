# synp 容器编排 ( 镜像定义见 scripts/build/Dockerfile )。
#
# ================================ 镜像构建 ================================
# 本地构建 ( 二选一 ):
#   make image                                 # tag = git describe, 经 ldflags 注入版本
#   SYNP_VERSION=v1.2.3 docker compose build   # tag = synp:v1.2.3, buildinfo 同源
#   ( 国内网络: GOPROXY=https://goproxy.cn,direct 加命令前缀 )
#
# ============================ 镜像推送 ( registry ) ============================
# 镜像名 = ${SYNP_IMAGE:-synp}:${SYNP_VERSION:-dev}, 推仓库只需
# SYNP_IMAGE 覆盖前缀, 无需修改本文件。
#
# Docker Hub:
#   docker login
#   SYNP_IMAGE=<dockerhub用户名>/synp SYNP_VERSION=v1.2.3 docker compose build
#   SYNP_IMAGE=<dockerhub用户名>/synp SYNP_VERSION=v1.2.3 docker compose push
#
# 私有仓库 ( 自建 registry / Harbor / 云厂商镜像服务, 换成实际地址 ):
#   docker login reg.example.com:5000
#   SYNP_IMAGE=reg.example.com:5000/synp/gateway SYNP_VERSION=v1.2.3 docker compose build
#   SYNP_IMAGE=reg.example.com:5000/synp/gateway SYNP_VERSION=v1.2.3 docker compose push
#
#   make image 的产物也可手工推送 ( 两步 ):
#   docker tag synp:v1.2.3 reg.example.com:5000/synp/gateway:v1.2.3
#   docker push  reg.example.com:5000/synp/gateway:v1.2.3
#
#   ( 注意: 自建 registry 走 HTTP 时, 需在 docker daemon 配置 insecure-registries )
#
# 部署机拉取运行 ( 不在部署机构建 ):
#   SYNP_IMAGE=reg.example.com:5000/synp/gateway SYNP_VERSION=v1.2.3 \
#     SYNP_CONFIG=./etc/config.prod.yaml docker compose up -d --pull always
#   ( --pull always 强制走仓库, 避免部署机本地误构建 )
#
# 以上变量可写入本目录 .env 持久化 ( SYNP_IMAGE / SYNP_VERSION / SYNP_CONFIG /
# GOPROXY ... ), 免去每次命令行前缀。
#
# ================================= 常用命令 =================================
#   docker compose up -d             # 镜像不存在时自动构建并启动
#   docker compose up -d --build     # 代码变更后强制重建
#
# 前置依赖 ( 均为外部服务, 本文件不负责拉起 ):
#   - kafka 三节点 mTLS 集群: scripts/docker/kafka
#   - etcd / redis / backend ( JWKS + SyncService ): backend 仓库
#   - etc/config.yaml ( 配置不打包进镜像, 运行时只读挂载 )

services:
  synp:
    build:
      context: .
      dockerfile: scripts/build/Dockerfile
      args:
        VERSION: ${SYNP_VERSION:-dev}
        # 国内网络: GOPROXY=https://goproxy.cn,direct docker compose build
        GOPROXY: "${GOPROXY:-}"
    # 镜像名 = ${SYNP_IMAGE:-synp}:${SYNP_VERSION:-dev}: 默认与 make image
    # 的 tag 命名保持一致; 推送/拉取仓库时用 SYNP_IMAGE 覆盖前缀 ( 见文件头说明 )。
    image: ${SYNP_IMAGE:-synp}:${SYNP_VERSION:-dev}

    container_name: synp
    hostname: synp
    restart: unless-stopped

    # 与 kafka / etcd 等中间件复用外部网络 ( 需已存在, 由 scripts/docker/kafka/init.sh 创建 );
    # 容器也可直接经宿主机 IP ( etc/config.yaml 中的 192.168.3.3 ) 访问各依赖。
    networks:
      - jrmarcco_net

    ports:
      # WebSocket 数据面 ( 客户端长连接入口 )。
      - "${SYNP_WS_PORT:-10071}:10071"
      # gRPC NotifyService ( backend 即时通知通道 )。
      # 宿主机必须发布该端口, 保证 etc/config.yaml 的 synp.grpc.addr
      # 广播地址 ( 192.168.3.3:50051 ) 从 backend 真实可达。
      - "${SYNP_GRPC_PORT:-50051}:50051"
      # 管理面 /metrics /healthz /readyz /version /debug/pprof。
      # 默认只绑宿主机回环 ( pprof 暴露公网有信息泄露/DoS 风险 );
      # 跨机 Prometheus 抓取时置 SYNP_ADMIN_BIND=0.0.0.0。
      - "${SYNP_ADMIN_BIND:-127.0.0.1}:${SYNP_ADMIN_PORT:-9090}:9090"

    volumes:
      # 配置不打包进镜像, 运行时挂载; 联调可换 etc/config-joint.yaml。
      - ${SYNP_CONFIG:-./etc/config.yaml}:/app/etc/config.yaml:ro

    # SIGTERM 后网关需排空存量 WS 连接 ( shutdown_drain_timeout )
    # 并 flush kafka, 宽限期避免 docker stop 默认 10s 硬杀截断排空。
    # ( 健康探测沿用镜像内置 HEALTHCHECK: wget /healthz )
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  jrmarcco_net:
    external: true
