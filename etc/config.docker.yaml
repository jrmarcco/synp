# synp-gateway 容器运行配置 ( 基于 etc/config.yaml, 面向 192.168.3.3 中间件集群 )。
# 与原版的差异:
# - etcd 未启用认证 ( 服务器尚未创建用户 ), username/password 注释掉
# - etcd tls.server_name 置空: 服务器证书 SAN 为 node-1/2/3/localhost/192.168.3.3,
#   置空后按 endpoint 主机名 ( 192.168.3.3 ) 校验
# - etcd/kafka 内联证书已替换为服务器当前签发版本
# - synp.grpc.addr 广播本机宿主机局域网 IP ( 192.168.3.127 )
profile:
  env: dev

synp:
  # 运维管理端口 ( /metrics + /debug/pprof )
  admin:
    addr: ":9090"

  # 日志配置
  # mode:  dev ( 单行紧凑格式 ) | prod ( JSON，面向采集 )
  # level: debug | info | warn | error
  # color: auto | always | never ( 仅 dev 生效 )
  # file:  可选落盘段 ( 路径 + 轮转参数，lumberjack 按大小切割 ):
  #   file:
  #     path: /var/log/synp/synp.log
  #     max_size_mb: 100    # 单文件上限，超过切割
  #     max_backups: 7      # 保留旧文件份数 ( 0 保留全部 )
  #     max_age_days: 30    # 旧文件保留天数 ( 0 不限 )
  #     compress: true      # 旧文件 gzip 压缩
  log:
    mode: dev
    level: info

  # WebSocket 配置
  websocket:
    host: 0.0.0.0
    port: 10071
    # 连接建立后等待首帧 AUTH 的超时时间 ( 单位: 毫秒 )，
    # 超时未鉴权的连接由网关关闭。
    auth_timeout_ms: 15000

    # 最大并发连接数 ( 0 使用默认值 50000 )。
    max_connections: 50000

    # 空闲连接扫描 ( 仅关闭启用了 x-auto-close 的连接 )。
    idle_scan_interval: 30s
    idle_timeout: 2m

    # 优雅关闭时等待存量连接排空的超时时间。
    shutdown_drain_timeout: 10s
    compression:
      enabled: true
      # 服务端压缩时使用的滑动窗口大小 取值范围: 8-15 = 2^8 - 2^15 = 256B - 32KB
      # 内存/CPU 吃紧 ( 超高并发 ) 的场景下可以调整为 13。
      server_max_window_bits: 15
      server_no_context_takeover: false
      # 客户端压缩时使用的滑动窗口大小 取值范围: 8-15 = 2^8 - 2^15 = 256B - 32KB
      client_max_window_bits: 15
      client_no_context_takeover: false
      level: 6
      # 小于该大小的消息不压缩 ( 压缩开销高于收益 )。
      min_compress_size: 256

  grpc:
    name: synp-gateway
    # 广播本机宿主机局域网 IP ( Windows 主机, 容器 50051 已发布到宿主机 )。
    addr: 192.168.3.127:50051
    group: synp
    registry:
      key_prefix: synp
      lease_ttl: 30 # 单位：秒 ( 这里和 etcd api 保持一直所以是秒单位 )
      timeout: 10s

  # 后端 SyncService 配置 ( 收件箱与会话的增量同步 )
  sync_service:
    service_name: synp-backend
    insecure: true

  # 编解码器配置 ( json / proto )
  codec:
    type: json

  # 连接配置
  conn:
    # 连接注册表配置
    registry:
      ttl: 30m
      cache_ttl: 400ms
      empty_cache_ttl: 100ms
      key_prefix: synp:conn:registry

    # 连接生命周期处理器配置
    handler:
      cache_request_timeout: 10s
      cache_expiration: 10s

    # 连接管理器配置
    manager:
      # 鉴权前读超时 ( AUTH 超时兜底 )。
      read_timeout: 15s
      # 鉴权后读超时 ( 应用层心跳保活，长超时减少 deadline 唤醒 )。
      established_read_timeout: 90s
      write_timeout: 10s
      init_retry_interval: 1s
      max_retry_interval: 5s
      max_retry_count: 3
      send_buffer_size: 256
      receive_buffer_size: 256
      close_timeout: 1s
      # 入站数据帧大小上限 ( 超限断连，防 OOM )，0 使用默认 64KiB。
      max_message_bytes: 65536

  # 消息处理器配置
  message_handler:
    frontend:
      topic: synp.message.upstream
      on_receive_timeout: 3s
    sync:
      timeout: 10s
    notify:
      # NOTIFY 帧发送入队等待上限，超时丢弃 ( 通知可丢 )。
      enqueue_timeout: 200ms

  # 网关事件消费者配置
  gateway:
    consumer:
      # 通知消息消费者 ( 广播消费: group_id 会自动追加本节点地址 )
      event_message_notify:
        topic: synp.message.notify
        group_id: synp-notify-consumer
        partitions: 6
        handle_timeout: 16s

# 连接鉴权 JWT 配置 ( RS256 + JWKS )
jwt:
  issuer: synp-auth
  # 受众，固定为网关服务标识，防止为其它用途签发的 token 被重放到网关连接上。
  audience: synp-gateway
  # JWKS 端点，公钥定期拉取并缓存，token header 的 kid 用于密钥轮换。
  # 指向 backend ( hermet ) 的 web 端口。
  jwks_endpoint: http://192.168.3.3:10081/.well-known/jwks.json
  refresh_interval: 10m

etcd:
  endpoints:
    - 192.168.3.3:12379
    - 192.168.3.3:22379
    - 192.168.3.3:32379
  # 认证未启用 ( 服务器 etcd 尚未创建用户 ), 留空跳过认证。
  # username: synp
  # password: <passwd>
  dial_timeout: 10s
  tls:
    enabled: true
    # 置空则按 endpoint 主机名 ( 192.168.3.3 ) 校验, 命中服务器证书 IP SAN。
    server_name: ""
    insecure_skip_verify: false
    cert_pem: |
