    # SCRAM 认证配置 ( 当 mechanism 为 scram 或未设置时使用 )
    # username: synp
    # password: synp-secret
    # 建议使用环境变量存储密码
    # password: ${KAFKA_PASSWORD}

    # OAuth 认证配置 ( 当 mechanism 为 oauth 时使用 )
    # oauth:
    #   endpoint: http://192.168.3.3:18080/realms/kafka/protocol/openid-connect/token
